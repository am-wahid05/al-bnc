<fieldset>
             <form class="contact_form">

                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Abdul Wahid Mumuni" minlength="3">
                        
                    </div>

                     <div class="form_group">
                <label for="contct">Phone Number</label>
                <input type="tel" id="contact" placeholder="0530466346"  required>
                </div>

                 <div class="form_group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="abdul@gmail.com">
                  </div>

                   <div class="form_group">
                <label for="message">Message</label>
                <textarea name="message" id="message" required placeholder="Type your message here" minlength="20" cols="30" rows="3"></textarea>
                   </div> 
                  <button type="submit">SEND MESSAGE</button>

                </form>
